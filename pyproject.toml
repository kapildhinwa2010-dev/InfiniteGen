[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "infinitegen"
version = "0.1.0"
description = "InfiniteGen - Endless seeded matrix generation from a compact latent recipe"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
